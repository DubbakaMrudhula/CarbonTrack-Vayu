services:
  postgres:
    image: postgres:16-alpine
    container_name: vayu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vayu}
      POSTGRES_USER: ${POSTGRES_USER:-vayu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vayu_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vayu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vayu_user} -d ${POSTGRES_DB:-vayu}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vayu_pgdata:
    name: vayu_pgdata


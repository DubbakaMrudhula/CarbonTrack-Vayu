# Load optional .env file from parent workspace or current directory for native local runs
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Server configuration
server.port=${SERVER_PORT:8080}

# Application identification
spring.application.name=sustainability-backend

# PostgreSQL Datasource configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vayu}
spring.datasource.username=${POSTGRES_USER:vayu_user}
spring.datasource.password=${POSTGRES_PASSWORD:vayu_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
# ddl-auto=validate ensures Hibernate only validates entities against the schema created by Flyway.
spring.jpa.hibernate.ddl-auto=validate
# Disable Open EntityManager in View to prevent implicit database queries in the view/web layer.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator endpoints configuration
management.endpoints.web.exposure.include=health,info

# Custom Application Properties
# CORS allowed origin property used by CorsConfig bean.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT configuration
# IMPORTANT: This default secret is strictly for local development and testing. Never use in production.
app.jwt.secret=${JWT_SECRET:development_only_secret_key_must_be_at_least_256_bits_long_for_vayu_carbon_platform_2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

